<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isla del Osito Matemático</title>
  <style>
    :root {
      --cielo: #bfe8ff;
      --panel: #ffffffee;
      --primario: #2d7ff9;
      --secundario: #28a86b;
      --acento: #ffc857;
      --texto: #1b2a3a;
      --error: #cf2f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(#edf8ff, #d8efff);
      color: var(--texto);
    }
    .contenedor { max-width: 1040px; margin: 0 auto; padding: 18px; }
    .hero {
      background: linear-gradient(130deg, #58ccff, #2d7ff9);
      color: #fff;
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: 0 10px 20px rgba(45,127,249,.22);
    }
    .hero h1 { margin: 0; font-size: 1.5rem; }

    .marcador {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .card {
      background: var(--panel);
      border: 2px solid #d8e9ff;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
    }

    .pantalla {
      display: none;
      background: var(--panel);
      border-radius: 16px;
      border: 2px solid #d4e7ff;
      padding: 14px;
    }
    .pantalla.activa { display: block; }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 2px solid #9fd2ff;
      background: #dff5ff;
    }

    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--primario);
    }
    button.secundario { background: var(--secundario); }

    .info { margin: 8px 0 0; font-weight: 700; min-height: 24px; }

    .acertijo {
      margin-top: 12px;
      border-top: 2px dashed #b5d8ff;
      padding-top: 12px;
      display: none;
    }
    .acertijo h3 { margin: 0 0 8px; }
    .acertijo p { margin: 6px 0; }
    .acertijo input {
      width: 100%;
      max-width: 320px;
      border-radius: 10px;
      border: 1px solid #94c0ff;
      padding: 8px;
      margin-right: 8px;
    }
    .error { color: var(--error); }
    .pie { opacity: .75; text-align: center; margin-top: 14px; }
  </style>
</head>
<body>
  <main class="contenedor">
    <section class="hero">
      <h1>🧸 Isla del Osito Matemático</h1>
    </section>

    <section class="marcador">
      <div class="card">⭐ Puntos: <span id="puntos">0</span></div>
      <div class="card">🌸 Flores: <span id="flores">0</span></div>
      <div class="card">🗺️ Nivel: <span id="nivel">Mapa</span></div>
      <div class="card">🔓 Progreso: <span id="progreso">1/4</span></div>
    </section>

    <section id="pantallaMapa" class="pantalla activa">
      <h2>Mapa de isla</h2>
      <canvas id="mapaCanvas" width="980" height="360"></canvas>
      <div class="controles">
        <button id="mapaIzq">⬅ Mover</button>
        <button id="mapaDer">Mover ➡</button>
        <button id="mapaEntrar" class="secundario">Entrar nivel</button>
      </div>
      <p class="info" id="infoMapa"></p>
    </section>

    <section id="pantallaJuego" class="pantalla">
      <h2 id="tituloNivel">Nivel</h2>
      <canvas id="juegoCanvas" width="980" height="360"></canvas>
      <div class="controles">
        <button id="btnSaltar">Saltar (Espacio / ↑)</button>
        <button id="btnVolver" class="secundario">Volver al mapa</button>
      </div>
      <p class="info" id="infoJuego"></p>

      <div class="acertijo" id="zonaAcertijo">
        <h3>🔐 Ejercicio de lógica para pasar de nivel</h3>
        <p id="enunciadoAcertijo"></p>
        <p id="detalleAcertijo"></p>
        <input id="respuestaAcertijo" type="text" placeholder="Respuesta" />
        <button id="btnResponder">Validar</button>
        <p id="estadoAcertijo"></p>
      </div>
    </section>

    <p class="pie">Aventura + lógica olímpica.</p>
  </main>

  <script>
    const niveles = [
      {
        id: 1,
        nombre: "Nivel 1 - Playa de Conchas",
        distanciaObjetivo: 2200,
        velocidadBase: 280,
        floresMeta: 5,
        acertijo: {
          enunciado: "Usa los números 2, 3, 4 y 5 una sola vez para formar dos números de 2 cifras cuya suma sea 77.",
          detalle: "Escribe tu respuesta como AB+CD (ejemplo: 23+54).",
          validar: (input) => {
            const txt = input.replace(/\s+/g, "");
            if (!/^\d{2}\+\d{2}$/.test(txt)) return false;
            const [a, b] = txt.split("+").map(Number);
            const digitos = `${a}${b}`.split("").sort().join("");
            return a + b === 77 && digitos === "2345";
          }
        }
      },
      {
        id: 2,
        nombre: "Nivel 2 - Bosque de Pinos",
        distanciaObjetivo: 2600,
        velocidadBase: 310,
        floresMeta: 7,
        acertijo: {
          enunciado: "Un reloj se adelanta 5 minutos cada hora. Si a las 10:00 está bien, ¿qué marcará cuando pasen 3 horas reales?",
          detalle: "Formato HH:MM (24h).",
          validar: (input) => normalizar(input) === "13:15"
        }
      },
      {
        id: 3,
        nombre: "Nivel 3 - Ruinas del Faro",
        distanciaObjetivo: 3000,
        velocidadBase: 330,
        floresMeta: 8,
        acertijo: {
          enunciado: "Hay 18 fichas. Al repartirlas en partes iguales entre 3 amigas sobran 0. Si cada una entrega 2 fichas, ¿cuántas quedan entre las tres?",
          detalle: "Solo número.",
          validar: (input) => normalizar(input) === "12"
        }
      },
      {
        id: 4,
        nombre: "Nivel 4 - Cima de la Isla",
        distanciaObjetivo: 3400,
        velocidadBase: 350,
        floresMeta: 10,
        acertijo: {
          enunciado: "Piensa un número. Lo multiplicas por 4 y restas 6. Obtienes 26. ¿Cuál era el número?",
          detalle: "Solo número.",
          validar: (input) => normalizar(input) === "8"
        }
      }
    ];

    const estado = {
      puntos: 0,
      flores: 0,
      desbloqueadoHasta: 1,
      completados: new Set(),
      nivelActual: null,
      seleccionMapa: 1
    };

    const puntosEl = document.getElementById("puntos");
    const floresEl = document.getElementById("flores");
    const nivelEl = document.getElementById("nivel");
    const progresoEl = document.getElementById("progreso");

    const pantallaMapa = document.getElementById("pantallaMapa");
    const pantallaJuego = document.getElementById("pantallaJuego");

    const mapaCanvas = document.getElementById("mapaCanvas");
    const mapCtx = mapaCanvas.getContext("2d");
    const infoMapa = document.getElementById("infoMapa");

    const juegoCanvas = document.getElementById("juegoCanvas");
    const gameCtx = juegoCanvas.getContext("2d");
    const tituloNivel = document.getElementById("tituloNivel");
    const infoJuego = document.getElementById("infoJuego");

    const zonaAcertijo = document.getElementById("zonaAcertijo");
    const enunciadoAcertijo = document.getElementById("enunciadoAcertijo");
    const detalleAcertijo = document.getElementById("detalleAcertijo");
    const respuestaAcertijo = document.getElementById("respuestaAcertijo");
    const estadoAcertijo = document.getElementById("estadoAcertijo");

    let loopId = null;
    let lastTime = 0;
    let juego = null;
    let teclas = { saltoPresionado: false };

    function normalizar(v) {
      return v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function actualizarHUD() {
      puntosEl.textContent = estado.puntos;
      floresEl.textContent = estado.flores;
      nivelEl.textContent = estado.nivelActual ? `#${estado.nivelActual.id}` : "Mapa";
      progresoEl.textContent = `${estado.desbloqueadoHasta}/4`;
    }

    function mostrarMapa() {
      detenerLoop();
      estado.nivelActual = null;
      pantallaJuego.classList.remove("activa");
      pantallaMapa.classList.add("activa");
      infoMapa.textContent = `Nivel seleccionado: ${estado.seleccionMapa} ${estado.seleccionMapa <= estado.desbloqueadoHasta ? "(desbloqueado)" : "(bloqueado)"}`;
      actualizarHUD();
      dibujarMapa();
    }

    function dibujarMapa() {
      mapCtx.clearRect(0, 0, mapaCanvas.width, mapaCanvas.height);

      const grad = mapCtx.createLinearGradient(0, 0, 0, mapaCanvas.height);
      grad.addColorStop(0, "#b8ecff");
      grad.addColorStop(1, "#e9fbff");
      mapCtx.fillStyle = grad;
      mapCtx.fillRect(0, 0, mapaCanvas.width, mapaCanvas.height);

      mapCtx.fillStyle = "#7bc96f";
      mapCtx.beginPath();
      mapCtx.ellipse(490, 210, 420, 130, 0, 0, Math.PI * 2);
      mapCtx.fill();

      const nodos = [
        { x: 180, y: 210 },
        { x: 360, y: 175 },
        { x: 540, y: 215 },
        { x: 740, y: 180 }
      ];

      mapCtx.strokeStyle = "#f4de98";
      mapCtx.lineWidth = 10;
      mapCtx.beginPath();
      mapCtx.moveTo(nodos[0].x, nodos[0].y);
      nodos.slice(1).forEach((n) => mapCtx.lineTo(n.x, n.y));
      mapCtx.stroke();

      nodos.forEach((n, i) => {
        const nivelId = i + 1;
        const desbloqueado = nivelId <= estado.desbloqueadoHasta;
        const completado = estado.completados.has(nivelId);
        mapCtx.fillStyle = completado ? "#ffc857" : desbloqueado ? "#2ecc71" : "#aab7c3";
        mapCtx.beginPath();
        mapCtx.arc(n.x, n.y, 24, 0, Math.PI * 2);
        mapCtx.fill();
        mapCtx.fillStyle = "#1f2d3d";
        mapCtx.font = "bold 16px Trebuchet MS";
        mapCtx.fillText(String(nivelId), n.x - 5, n.y + 5);
      });

      const s = nodos[estado.seleccionMapa - 1];
      mapCtx.fillStyle = "#8a5b3d";
      mapCtx.beginPath();
      mapCtx.arc(s.x, s.y - 38, 12, 0, Math.PI * 2);
      mapCtx.fill();
      mapCtx.fillStyle = "#a67652";
      mapCtx.fillRect(s.x - 10, s.y - 28, 20, 16);

      mapCtx.fillStyle = "#1b2a3a";
      mapCtx.font = "bold 18px Trebuchet MS";
      mapCtx.fillText("Mover osito: ⬅ ➡ | Entrar: Enter", 20, 30);
    }

    function moverSeleccion(delta) {
      estado.seleccionMapa = Math.max(1, Math.min(4, estado.seleccionMapa + delta));
      infoMapa.textContent = `Nivel seleccionado: ${estado.seleccionMapa} ${estado.seleccionMapa <= estado.desbloqueadoHasta ? "(desbloqueado)" : "(bloqueado)"}`;
      dibujarMapa();
    }

    function intentarEntrarNivel() {
      const id = estado.seleccionMapa;
      if (id > estado.desbloqueadoHasta) {
        infoMapa.textContent = `Nivel ${id} bloqueado. Completa el nivel ${id - 1}.`;
        return;
      }
      iniciarNivel(id);
    }

    function crearNivelData(nivel) {
      const obstaculos = [];
      const flores = [];
      for (let x = 520; x <= nivel.distanciaObjetivo; x += 260 + Math.random() * 200) {
        obstaculos.push({ x, y: 296, w: 36 + Math.random() * 20, h: 26 + Math.random() * 34 });
      }
      for (let x = 340; x <= nivel.distanciaObjetivo; x += 190 + Math.random() * 140) {
        flores.push({ x, y: 250 - Math.random() * 80, r: 10, tomada: false });
      }
      return { obstaculos, flores };
    }

    function iniciarNivel(idNivel) {
      const nivel = niveles.find(n => n.id === idNivel);
      if (!nivel) return;

      const { obstaculos, flores } = crearNivelData(nivel);
      estado.nivelActual = nivel;

      pantallaMapa.classList.remove("activa");
      pantallaJuego.classList.add("activa");
      zonaAcertijo.style.display = "none";
      respuestaAcertijo.value = "";
      estadoAcertijo.textContent = "";

      juego = {
        nivel,
        osito: { x: 140, y: 252, w: 44, h: 48, vy: 0, enSuelo: true },
        sueloY: 300,
        camaraX: 0,
        progreso: 0,
        floresNivel: 0,
        terminado: false,
        listoAcertijo: false,
        obstaculos,
        flores,
      };

      tituloNivel.textContent = nivel.nombre;
      infoJuego.textContent = "Corre, junta flores y llega al final.";
      actualizarHUD();
      iniciarLoop();
    }

    function iniciarLoop() {
      detenerLoop();
      lastTime = performance.now();
      loopId = requestAnimationFrame(loop);
    }

    function detenerLoop() {
      if (loopId) cancelAnimationFrame(loopId);
      loopId = null;
    }

    function loop(now) {
      if (!juego || juego.terminado) return;

      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;

      actualizarJuego(dt);
      dibujarJuego();

      if (!juego.terminado) loopId = requestAnimationFrame(loop);
    }

    function saltar() {
      if (!juego || juego.terminado) return;
      if (juego.osito.enSuelo) {
        juego.osito.vy = -520;
        juego.osito.enSuelo = false;
      }
    }

    function colisionRect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function actualizarJuego(dt) {
      const g = juego;
      const o = g.osito;

      g.progreso += g.nivel.velocidadBase * dt;
      g.camaraX = Math.max(0, g.progreso - 180);

      o.vy += 1300 * dt;
      o.y += o.vy * dt;

      if (o.y + o.h >= g.sueloY) {
        o.y = g.sueloY - o.h;
        o.vy = 0;
        o.enSuelo = true;
      }

      for (const obs of g.obstaculos) {
        const local = { x: obs.x - g.camaraX, y: obs.y, w: obs.w, h: obs.h };
        if (colisionRect(o, local)) {
          estado.puntos = Math.max(0, estado.puntos - 8);
          infoJuego.textContent = "Te chocaste con un obstáculo. Reintentando nivel...";
          actualizarHUD();
          iniciarNivel(g.nivel.id);
          return;
        }
      }

      for (const flor of g.flores) {
        if (flor.tomada) continue;
        const dx = (flor.x - g.camaraX) - (o.x + o.w / 2);
        const dy = flor.y - (o.y + o.h / 2);
        if (Math.hypot(dx, dy) < flor.r + 12) {
          flor.tomada = true;
          g.floresNivel += 1;
          estado.flores += 1;
          estado.puntos += 12;
          actualizarHUD();
        }
      }

      if (g.progreso >= g.nivel.distanciaObjetivo) {
        detenerLoop();
        g.terminado = true;
        g.listoAcertijo = true;

        if (g.floresNivel < g.nivel.floresMeta) {
          infoJuego.textContent = `Faltan flores: ${g.floresNivel}/${g.nivel.floresMeta}. Reintentando...`;
          setTimeout(() => iniciarNivel(g.nivel.id), 900);
          return;
        }

        infoJuego.textContent = "Llegaste. Ahora resolvé el ejercicio para pasar de pantalla.";
        enunciadoAcertijo.textContent = g.nivel.acertijo.enunciado;
        detalleAcertijo.textContent = g.nivel.acertijo.detalle;
        zonaAcertijo.style.display = "block";
      }
    }

    function dibujarJuego() {
      const g = juego;
      gameCtx.clearRect(0, 0, juegoCanvas.width, juegoCanvas.height);

      const grad = gameCtx.createLinearGradient(0, 0, 0, juegoCanvas.height);
      grad.addColorStop(0, "#bde9ff");
      grad.addColorStop(1, "#edfbff");
      gameCtx.fillStyle = grad;
      gameCtx.fillRect(0, 0, juegoCanvas.width, juegoCanvas.height);

      gameCtx.fillStyle = "#8ad57c";
      gameCtx.fillRect(0, g.sueloY, juegoCanvas.width, juegoCanvas.height - g.sueloY);

      for (let i = 0; i < 8; i++) {
        const x = ((i * 260 - g.camaraX * 0.35) % (juegoCanvas.width + 280)) - 140;
        gameCtx.fillStyle = "#68ab67";
        gameCtx.beginPath();
        gameCtx.moveTo(x, g.sueloY);
        gameCtx.lineTo(x + 70, 190);
        gameCtx.lineTo(x + 140, g.sueloY);
        gameCtx.fill();
      }

      g.flores.forEach((f) => {
        if (f.tomada) return;
        const x = f.x - g.camaraX;
        gameCtx.fillStyle = "#ff6fa8";
        gameCtx.beginPath();
        gameCtx.arc(x, f.y, f.r, 0, Math.PI * 2);
        gameCtx.fill();
        gameCtx.fillStyle = "#ffdd67";
        gameCtx.beginPath();
        gameCtx.arc(x, f.y, 4, 0, Math.PI * 2);
        gameCtx.fill();
      });

      g.obstaculos.forEach((obs) => {
        gameCtx.fillStyle = "#6f5145";
        gameCtx.fillRect(obs.x - g.camaraX, obs.y, obs.w, obs.h);
      });

      const o = g.osito;
      gameCtx.fillStyle = "#8b5f42";
      gameCtx.fillRect(o.x, o.y + 12, o.w, o.h - 12);
      gameCtx.fillStyle = "#a97757";
      gameCtx.beginPath();
      gameCtx.arc(o.x + o.w / 2, o.y + 14, 15, 0, Math.PI * 2);
      gameCtx.fill();

      gameCtx.fillStyle = "#1f2d3d";
      gameCtx.font = "bold 16px Trebuchet MS";
      gameCtx.fillText(`Flores nivel: ${g.floresNivel}/${g.nivel.floresMeta}`, 14, 24);
      const pct = Math.min(100, Math.round((g.progreso / g.nivel.distanciaObjetivo) * 100));
      gameCtx.fillText(`Recorrido: ${pct}%`, 14, 46);
    }

    function validarAcertijo() {
      if (!juego || !juego.listoAcertijo) return;
      const ok = juego.nivel.acertijo.validar(respuestaAcertijo.value.trim());
      if (!ok) {
        estadoAcertijo.textContent = "Respuesta incorrecta. Revisá y probá otra vez.";
        estadoAcertijo.className = "error";
        return;
      }

      estado.puntos += 60;
      estado.completados.add(juego.nivel.id);
      estado.desbloqueadoHasta = Math.max(estado.desbloqueadoHasta, Math.min(4, juego.nivel.id + 1));
      estado.seleccionMapa = Math.min(4, juego.nivel.id + 1);
      actualizarHUD();

      if (estado.completados.size === 4) {
        alert("🏆 ¡Completaste toda la isla del osito matemático!");
      }

      infoJuego.textContent = "¡Ejercicio correcto! Nivel desbloqueado.";
      setTimeout(mostrarMapa, 700);
    }

    document.getElementById("mapaIzq").addEventListener("click", () => moverSeleccion(-1));
    document.getElementById("mapaDer").addEventListener("click", () => moverSeleccion(1));
    document.getElementById("mapaEntrar").addEventListener("click", intentarEntrarNivel);

    document.getElementById("btnSaltar").addEventListener("click", saltar);
    document.getElementById("btnVolver").addEventListener("click", mostrarMapa);
    document.getElementById("btnResponder").addEventListener("click", validarAcertijo);

    window.addEventListener("keydown", (e) => {
      if (pantallaMapa.classList.contains("activa")) {
        if (e.code === "ArrowLeft") moverSeleccion(-1);
        if (e.code === "ArrowRight") moverSeleccion(1);
        if (e.code === "Enter") intentarEntrarNivel();
      }

      if (pantallaJuego.classList.contains("activa")) {
        if (e.code === "Space" || e.code === "ArrowUp") {
          e.preventDefault();
          if (!teclas.saltoPresionado) saltar();
          teclas.saltoPresionado = true;
        }
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") teclas.saltoPresionado = false;
    });

    actualizarHUD();
    mostrarMapa();
  </script>
</body>
</html>
